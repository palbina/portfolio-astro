name: 🚀 Build and Push Portfolio (Forgejo)

on:
  push:
    branches: [ master ]

env:
  REGISTRY: 10.99.141.31:5000
  IMAGE_NAME: portfolio-astro

jobs:
  build:
    name: 🏗️ Build & Push to Zot
    runs-on: ubuntu-latest
    
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      # 🚨 OBLIGATORIO: Evita errores de TLS/MTU en el clúster Talos
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."10.99.141.31:5000"]
              http = true
              insecure = true

      - name: 🔐 Log in to Local Zot Registry
        run: |
          echo "${{ secrets.ZOT_PASSWORD }}" | docker login http://10.99.141.31:5000 --username cleanup --password-stdin

      - name: 🏗️ Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/palbina/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/palbina/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
