name: Build and Push to Zot
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug ZOT_PASSWORD
        run: |
          echo "Password length: ${#ZOT_PASSWORD}"
          echo "Expected base64: Y2xlYW51cDpab3RDbGVhbnVwMjAyNiFTZWN1cmU="
          AUTH=$(echo -n "cleanup:$ZOT_PASSWORD" | base64 -w0)
          echo "Actual base64:   $AUTH"
          if [ "$AUTH" = "Y2xlYW51cDpab3RDbGVhbnVwMjAyNiFTZWN1cmU=" ]; then
            echo "MATCH - password is correct"
          else
            echo "MISMATCH - password is different!"
          fi
        env:
          ZOT_PASSWORD: ${{ secrets.ZOT_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."registry-taloslab.subetupaginacp.com:5000"]
              http = true
              insecure = true
      - name: Configure Zot registry credentials
        run: |
          mkdir -p ~/.docker
          AUTH=$(echo -n "cleanup:${{ secrets.ZOT_PASSWORD }}" | base64 -w0)
          cat > ~/.docker/config.json << EOF
          {
            "auths": {
              "registry-taloslab.subetupaginacp.com:5000": {
                "auth": "$AUTH"
              }
            }
          }
          EOF
          echo "Docker config created"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry-taloslab.subetupaginacp.com:5000/palbina/portfolio-astro:latest
